<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Administrateur</title>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>

    <header>
        <h1>Portail des Notes Étudiant</h1>
        <p>Accédez à vos résultats d’examen </p>
    </header>                                                                                                

    <main>
        <div class="login-box">
            <h2>Connexion à votre espace</h2>
            <form action="#" method="POST">
                <label for="login">Email ou Matricule</label>
                <input type="text" id="login" name="login" placeholder="ex: ET12345" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>

                <button type="submit">Se connecter</button>
            </form>

            <div class="options">
                <a href="#">Mot de passe oublié ?</a><br>
                <a href="#">Pas encore inscrit ? Contactez l’administrateur</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 -|Yassine DEV|</p>
    </footer>

</body>
</html>
